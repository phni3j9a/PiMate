<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<title>チャット — PC で操作が必要</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><style>
html,body{margin:0;overflow:hidden}
.sheet>*{flex-shrink:0}
</style><meta name="viewport" content="width=390">
</head>
<body>

<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF; color: #1F2326; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; font-size: 14px; line-height: 1.5; word-break: auto-phrase; text-wrap: pretty">
  <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; height: 47px; box-sizing: border-box; padding: 4px 28px 0 42px; display: flex; align-items: center; justify-content: space-between; color: #1F2326; pointer-events: none">
    <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.2px; font-variant-numeric: tabular-nums">9:41</span>
    <span style="display: flex; align-items: center; gap: 6px">
      <svg width="18" height="12" viewBox="0 0 18 12" style="fill: currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" style="fill: currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zM8 9.4c.5 0 .9.2 1.2.5L8 11.6 6.8 9.9c.3-.3.7-.5 1.2-.5z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" style="fill: none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" style="stroke: currentColor; opacity: 0.4"></rect><rect x="2" y="2" width="20" height="9" rx="2" style="fill: currentColor"></rect><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" style="fill: currentColor; opacity: 0.4"></path></svg>
    </span>
  </div>
  <div style="height: 47px; flex-shrink: 0"></div>

  <header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 6px">
    <button aria-label="Instance 一覧を開く" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; padding: 0; border-radius: 10px; background: transparent; color: #1F2326; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round"><path d="M4 8h16M4 16h10"></path></svg>
    </button>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <div style="font-size: 15px; font-weight: 600; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">ブランチの整理</div>
    </div>
    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 6px; color: #8B5D20; font-size: 12px; font-weight: 600">
      <span style="width: 7px; height: 7px; border-radius: 4px; background: #E1AD42"></span>PC で操作待ち
    </div>
    <button aria-label="セッションメニュー" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; padding: 0; border-radius: 10px; background: transparent; color: #5E686D; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor; stroke: none"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
    </button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 0 20px 12px; display: flex; flex-direction: column; justify-content: flex-end">
    <div style="display: flex; justify-content: flex-end">
      <div style="max-width: 280px; background: #DFE7EC; border-radius: 18px; padding: 10px 14px">ローカルのブランチを一覧にして</div>
    </div>
    <button style="align-self: flex-start; margin-top: 10px; display: flex; align-items: center; gap: 6px; border: 0; padding: 4px 0; background: transparent; color: #5E686D; font-family: inherit; font-size: 12px">
      6秒 作業 · ツール 1 回
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <p style="margin: 6px 0 0">ブランチは 14 本あり、そのうち 6 本は <code style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; background: #F1F3F4; border-radius: 5px; padding: 1px 5px">main</code> にマージ済みです。</p>
    <div style="margin-top: 6px; font-size: 11px; color: #5E686D">claude-sonnet-5-5 · 4.8k in · 160 out · $0.02</div>

    <div style="margin-top: 32px; display: flex; justify-content: flex-end">
      <div style="max-width: 280px; background: #DFE7EC; border-radius: 18px; padding: 10px 14px">コミット履歴を見ながら、不要なブランチを整理して</div>
    </div>
    <button style="align-self: flex-start; margin-top: 10px; display: flex; align-items: center; gap: 6px; border: 0; padding: 4px 0; background: transparent; color: #5E686D; font-family: inherit; font-size: 12px">
      9秒 作業 · ツール 2 回
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <p style="margin: 6px 0 0">グラフを開きました。削除するブランチを選んでください。</p>
    <section aria-label="スマホでは操作できない画面" style="margin-top: 24px; padding: 16px; border-radius: 16px; background: #F1F3F4">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #1F2326">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M7 9l3 2-3 2M12 13h4"></path></svg>
        PC のターミナルで操作が必要です
      </div>
      <p style="margin: 8px 0 0; font-size: 13px; color: #3A4246">Extension「git-graph」の独自画面は、スマホでは操作できません。PC で操作が終わるまで、Pi はこのまま待ちます。</p>
      <div style="margin-top: 14px; display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 0 0 14px; border-radius: 22px; background: #FFFFFF">
        <code style="flex: 1; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px">pimate attach ops-91c2</code>
        <button aria-label="コマンドをコピー" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; padding: 0; background: transparent; color: #5E686D; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg>
        </button>
      </div>
    </section>
  </main>

  <footer style="flex-shrink: 0; padding: 6px 16px 30px; background: #FFFFFF">
    <div style="padding: 12px 8px 6px 14px; border-radius: 24px; background: #F1F3F4">
      <label for="composer-attach" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">メッセージ</label>
      <textarea id="composer-attach" rows="1" disabled="" placeholder="PC での操作が終わると入力できます" style="display: block; width: 100%; box-sizing: border-box; border: 0; outline: none; resize: none; background: transparent; padding: 0; color: #5E686D; font-family: inherit; font-size: 15px; line-height: 22px; height: 22px"></textarea>
      <div style="margin-top: 6px; display: flex; align-items: center; gap: 2px">
        <button aria-label="添付" disabled="" style="width: 36px; height: 36px; flex-shrink: 0; margin-left: -8px; border: 0; padding: 0; background: transparent; color: #5E686D; opacity: 0.5; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
        <button aria-haspopup="dialog" style="height: 36px; display: flex; align-items: center; gap: 3px; border: 0; padding: 0 6px; background: transparent; color: #5E686D; font-family: inherit; font-size: 13px">
          Sonnet 5.5 · medium
          <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <span style="flex: 1"></span>
        <button aria-label="送信" disabled="" style="width: 36px; height: 36px; flex-shrink: 0; border: 0; padding: 0; border-radius: 18px; background: #E6E9EB; color: #5E686D; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
        </button>
      </div>
    </div>
  </footer>
</div>

</body></html>
