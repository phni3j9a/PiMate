<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<title>PC に PiMate を入れる</title>
<meta name="viewport" content="width=390">
</head>
<body>

<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;overflow:hidden}
a{color:#155A7A}a:hover{color:#1B6B91}
@keyframes pi-cursor{0%,55%{opacity:1}56%,100%{opacity:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF; color: #1F2326; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; font-size: 14px; line-height: 1.5; word-break: auto-phrase; text-wrap: pretty">
  <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; height: 47px; box-sizing: border-box; padding: 4px 28px 0 42px; display: flex; align-items: center; justify-content: space-between; color: #1F2326; pointer-events: none">
    <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.2px; font-variant-numeric: tabular-nums">9:41</span>
    <span style="display: flex; align-items: center; gap: 6px">
      <svg width="18" height="12" viewBox="0 0 18 12" style="fill: currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" style="fill: currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zM8 9.4c.5 0 .9.2 1.2.5L8 11.6 6.8 9.9c.3-.3.7-.5 1.2-.5z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" style="fill: none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" style="stroke: currentColor; opacity: 0.4"></rect><rect x="2" y="2" width="20" height="9" rx="2" style="fill: currentColor"></rect><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" style="fill: currentColor; opacity: 0.4"></path></svg>
    </span>
  </div>
  <div style="height: 47px; flex-shrink: 0"></div>

  <header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; padding: 0 6px">
    <button aria-label="戻る" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; padding: 0; border-radius: 10px; background: transparent; color: #1F2326; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <h1 style="flex: 1; margin: 0; font-size: 17px; font-weight: 600">PC に PiMate を入れる</h1>
    <div role="img" aria-label="手順 2 / 3" style="display: flex; align-items: center; gap: 4px; padding-right: 14px">
      <span style="width: 8px; height: 8px; border-radius: 2px; background: #1B6B91; opacity: 0.35"></span>
      <span style="width: 8px; height: 8px; border-radius: 2px; background: #1B6B91"></span>
      <span style="width: 8px; height: 8px; border-radius: 2px; background: #E6E9EB"></span>
      <span style="margin-left: 6px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #5E686D">2/3</span>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 20px 0; display: flex; flex-direction: column">
    <p style="margin: 0; font-size: 15px; line-height: 22.5px; color: #5E686D">Node.js 22 以上と Pi 1.2.0 以上が必要です。</p>

    <div style="margin-top: 24px; display: flex; align-items: center; gap: 10px">
      <span style="width: 22px; height: 22px; border-radius: 6px; background: #F1F3F4; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600; color: #3A4246">1</span>
      <span style="font-size: 15px; line-height: 22px">ターミナルで実行します</span>
    </div>
    <div style="margin-top: 10px; display: flex; align-items: flex-start; gap: 4px; padding: 12px 4px 12px 16px; border-radius: 16px; background: {{termBg}}">
      <code style="flex: 1; min-width: 0; display: flex; flex-direction: column; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; line-height: 20px; color: {{termText}}">
        <span><span style="color: {{termDim}}">$ </span>pi install npm:@phni3j9a/pimate</span>
        <span><span style="color: {{termDim}}">$ </span>pi</span>
      </code>
      <button aria-label="コマンドをコピー" style="width: 36px; height: 36px; margin-top: -8px; flex-shrink: 0; border: 0; padding: 0; border-radius: 10px; background: transparent; color: {{termDim}}; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg>
      </button>
    </div>
    <span style="margin-top: 8px; font-size: 12px; line-height: 18px; color: #5E686D">PiMate を入れて、そのまま Pi を起動します。</span>

    <div style="margin-top: 24px; display: flex; align-items: center; gap: 10px">
      <span style="width: 22px; height: 22px; border-radius: 6px; background: #F1F3F4; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600; color: #3A4246">2</span>
      <span style="font-size: 15px; line-height: 22px">Pi の入力欄で実行します</span>
    </div>
    <div style="margin-top: 10px; padding: 8px 4px 12px 16px; border-radius: 16px; background: {{termBg}}; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="14" height="14" viewBox="0 0 4 4" aria-hidden="true" style="flex-shrink: 0; shape-rendering: crispEdges"><rect x="0" y="0" width="3" height="1" style="fill: {{logoCoral}}"></rect><rect x="2" y="1" width="1" height="1" style="fill: {{logoCoral}}"></rect><rect x="0" y="1" width="1" height="3" style="fill: {{logoBlue}}"></rect><rect x="1" y="2" width="1" height="1" style="fill: {{logoBlue}}"></rect><rect x="3" y="2" width="1" height="2" style="fill: {{logoYellow}}"></rect></svg>
        <span style="flex: 1; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: {{termDim}}">pi</span>
        <button aria-label="コマンドをコピー" style="width: 36px; height: 36px; flex-shrink: 0; border: 0; padding: 0; border-radius: 10px; background: transparent; color: {{termDim}}; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg>
        </button>
      </div>
      <div style="margin-right: 12px; display: flex; flex-direction: column; gap: 8px">
        <div style="height: 1px; background: {{termRule}}"></div>
        <div style="display: flex; align-items: center; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 14px; line-height: 20px; color: {{termText}}">/pimate setup<span aria-hidden="true" style="width: 8px; height: 17px; margin-left: 2px; background: {{termText}}; animation: pi-cursor 1.1s steps(1) infinite"></span></div>
        <div style="height: 1px; background: {{termRule}}"></div>
      </div>
    </div>
    <span style="margin-top: 8px; font-size: 12px; line-height: 18px; color: #5E686D">常駐の登録と pimate コマンドの追加を聞かれます（どちらも任意）。最後に QR コードが出ます。</span>

    <p style="margin: 20px 0 0; font-size: 12px; line-height: 18px; color: #5E686D">ペアリングし直すときや 2 台目のスマホでは <code style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; color: #3A4246">/pimate pair</code> で QR を出し直せます。</p>
    <button style="margin-top: 4px; min-height: 44px; align-self: flex-start; display: flex; align-items: center; gap: 8px; border: 0; padding: 0; background: transparent; color: #155A7A; font-family: inherit; font-size: 15px">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M12 15V4M8 8l4-4 4 4M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"></path></svg>
      この手順を PC に送る
    </button>
  </main>

  <footer style="flex-shrink: 0; padding: 8px 20px 30px; display: flex; flex-direction: column; gap: 4px">
    <button style="height: 48px; border: 0; border-radius: 12px; background: #1B6B91; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600">QRコードを読み取る</button>
  </footer>
</div>

</body></html>
