<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = (a, b, mark, text) => ({
      a: a, b: b, mark: mark, text: text,
      bg: mark === '+' ? '#E8F3F9' : (mark === '-' ? '#FBEDEB' : 'transparent'),
      color: mark === '+' ? '#22607E' : (mark === '-' ? '#9A453E' : '#1F2326')
    });
    return {
      lines: [
        L('1', '', '-', 'export function greet(name: string) {'),
        L('', '1', '+', 'export function greet('),
        L('', '2', '+', '  name: string,'),
        L('', '3', '+', '  opts: { shout?: boolean } = {},'),
        L('', '4', '+', ') {'),
        L('2', '', '-', '  return `Hello, ${name}!`;'),
        L('', '5', '+', '  const s = `Hello, ${name}!`;'),
        L('', '6', '+', '  return opts.shout ? s.toUpperCase() : s;'),
        L('3', '7', ' ', '}'),
        L('4', '8', ' ', ''),
        L('5', '9', ' ', 'export const VERSION = "0.2.0";')
      ],
      files: [
        { kind: 'A', path: 'src/greet.test.ts', add: '+18', badgeBg: '#E8F3F9', badgeColor: '#22607E' },
        { kind: 'M', path: 'README.md', add: '+2', badgeBg: '#F1F3F4', badgeColor: '#5E686D' }
      ]
    };
  }
}
