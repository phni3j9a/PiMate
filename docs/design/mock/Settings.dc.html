<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;overflow:hidden}
.sheet>*{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF; color: #1F2326; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; font-size: 14px; line-height: 1.5; word-break: auto-phrase; text-wrap: pretty">
  <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; height: 47px; box-sizing: border-box; padding: 4px 28px 0 42px; display: flex; align-items: center; justify-content: space-between; color: #1F2326; pointer-events: none">
    <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.2px; font-variant-numeric: tabular-nums">9:41</span>
    <span style="display: flex; align-items: center; gap: 6px">
      <svg width="18" height="12" viewBox="0 0 18 12" style="fill: currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" style="fill: currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zM8 9.4c.5 0 .9.2 1.2.5L8 11.6 6.8 9.9c.3-.3.7-.5 1.2-.5z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" style="fill: none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" style="stroke: currentColor; opacity: 0.4"></rect><rect x="2" y="2" width="20" height="9" rx="2" style="fill: currentColor"></rect><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" style="fill: currentColor; opacity: 0.4"></path></svg>
    </span>
  </div>
  <div style="height: 47px; flex-shrink: 0"></div>

  <header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; padding: 0 6px">
    <button aria-label="戻る" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; padding: 0; border-radius: 10px; background: transparent; color: #1F2326; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <h1 style="flex: 1; margin: 0; font-size: 17px; font-weight: 600">設定</h1>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 20px 30px; display: flex; flex-direction: column">
    <div style="font-size: 12px; font-weight: 600; color: #5E686D">マシン</div>
    <div style="margin-top: 2px; display: flex; flex-direction: column">
      <sc-for list="{{machines}}" as="m" hint-placeholder-count="2">
        <button style="min-height: 60px; display: flex; align-items: center; gap: 12px; border: 0; padding: 8px 0; background: transparent; color: #1F2326; font-family: inherit; text-align: left">
          <span style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 4px; background: #4D9ABF"></span>
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 15px">{{m.name}}</span>
            <span style="font-size: 12px; color: #5E686D">{{m.detail}}</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #5E686D; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </sc-for>
      <button style="height: 52px; display: flex; align-items: center; gap: 12px; border: 0; padding: 0; background: transparent; color: #155A7A; font-family: inherit; font-size: 15px; text-align: left">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg>
        マシンを追加（ペアリング）
      </button>
    </div>

    <div style="margin-top: 28px; font-size: 12px; font-weight: 600; color: #5E686D">通知</div>
    <div style="margin-top: 2px; display: flex; flex-direction: column">
      <sc-for list="{{notifs}}" as="n" hint-placeholder-count="3">
        <div style="min-height: 60px; display: flex; align-items: center; gap: 16px; padding: 8px 0">
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 15px">{{n.label}}</span>
            <span style="font-size: 12px; color: #5E686D">{{n.detail}}</span>
          </span>
          <button role="switch" aria-checked="{{n.on}}" aria-label="{{n.label}}" style="width: 51px; height: 31px; flex-shrink: 0; border: 0; padding: 2px; box-sizing: border-box; border-radius: 16px; background: {{n.track}}; display: flex; justify-content: {{n.justify}}">
            <span style="width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF"></span>
          </button>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 28px; font-size: 12px; font-weight: 600; color: #5E686D">表示</div>
    <div style="margin-top: 2px; padding: 8px 0; display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; font-size: 15px">文字サイズ</span>
      <div role="radiogroup" aria-label="文字サイズ" style="height: 36px; box-sizing: border-box; padding: 3px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 168px; border-radius: 10px; background: #E6E9EB">
        <button role="radio" aria-checked="false" style="height: 30px; border: 0; border-radius: 7px; background: transparent; color: #5E686D; font-family: inherit; font-size: 12px">小</button>
        <button role="radio" aria-checked="true" style="height: 30px; border: 0; border-radius: 7px; background: #FFFFFF; color: #1F2326; font-family: inherit; font-size: 12px; font-weight: 600">標準</button>
        <button role="radio" aria-checked="false" style="height: 30px; border: 0; border-radius: 7px; background: transparent; color: #5E686D; font-family: inherit; font-size: 12px">大</button>
      </div>
    </div>

    <div style="margin-top: 28px; font-size: 12px; font-weight: 600; color: #5E686D">互換性</div>
    <div style="margin-top: 2px">
      <button style="width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; border: 0; padding: 8px 0; background: transparent; color: #1F2326; font-family: inherit; text-align: left">
        <span style="flex: 1; display: flex; flex-direction: column">
          <span style="font-size: 15px">Pi の機能と Extension の対応状況</span>
          <span style="font-size: 12px; color: #5E686D">スマホで使えない操作と、その代わりの方法</span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #5E686D; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>

    <div style="margin-top: auto; padding-top: 16px; text-align: center; font-size: 12px; color: #5E686D">PiMate [VERSION] · Extension [VERSION]</div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sw = (label, detail, on) => ({
      label: label, detail: detail, on: on ? 'true' : 'false',
      track: on ? '#1B6B91' : '#D3D9DC', justify: on ? 'flex-end' : 'flex-start'
    });
    return {
      machines: [
        { name: 'MacBook', detail: '接続中 · macOS · Pi 3 件' },
        { name: 'server-Macmini', detail: '接続中 · Linux · Pi 1 件' }
      ],
      notifs: [
        sw('入力待ち', 'Pi が質問や確認を求めたとき', true),
        sw('完了', '作業が終わったとき', true),
        sw('失敗', 'エラーで止まったとき', true)
      ]
    };
  }
}
</script>
</body>
</html>
