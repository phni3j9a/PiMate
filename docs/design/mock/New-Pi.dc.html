<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>新しい Pi を起動</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;overflow:hidden}
.sheet>*{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF; color: #1F2326; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; font-size: 14px; line-height: 1.5; word-break: auto-phrase; text-wrap: pretty">
  <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; height: 47px; box-sizing: border-box; padding: 4px 28px 0 42px; display: flex; align-items: center; justify-content: space-between; color: #1F2326; pointer-events: none">
    <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.2px; font-variant-numeric: tabular-nums">9:41</span>
    <span style="display: flex; align-items: center; gap: 6px">
      <svg width="18" height="12" viewBox="0 0 18 12" style="fill: currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" style="fill: currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zM8 9.4c.5 0 .9.2 1.2.5L8 11.6 6.8 9.9c.3-.3.7-.5 1.2-.5z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" style="fill: none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" style="stroke: currentColor; opacity: 0.4"></rect><rect x="2" y="2" width="20" height="9" rx="2" style="fill: currentColor"></rect><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" style="fill: currentColor; opacity: 0.4"></path></svg>
    </span>
  </div>
  <div style="height: 47px; flex-shrink: 0"></div>

  <header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; padding: 0 6px">
    <button aria-label="閉じる" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; padding: 0; border-radius: 10px; background: transparent; color: #1F2326; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <h1 style="flex: 1; margin: 0; text-align: center; font-size: 15px; font-weight: 600">新しい Pi</h1>
    <span style="width: 44px"></span>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 20px 0; display: flex; flex-direction: column">
    <div id="newpi-machine-label" style="font-size: 12px; font-weight: 600; color: #5E686D">マシン</div>
    <div role="radiogroup" aria-labelledby="newpi-machine-label" style="display: flex; flex-direction: column">
      <sc-for list="{{machines}}" as="m" hint-placeholder-count="2">
        <button role="radio" aria-checked="{{m.checked}}" style="height: 52px; display: flex; align-items: center; gap: 10px; border: 0; padding: 0; background: transparent; color: #1F2326; font-family: inherit; font-size: 15px; text-align: left">
          <span style="width: 7px; height: 7px; flex-shrink: 0; border-radius: 4px; background: #4D9ABF"></span>
          <span style="flex: 1">{{m.name}}</span>
          <sc-if value="{{m.isSel}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: #1B6B91; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
        </button>
      </sc-for>
    </div>

    <label for="newpi-folder" style="margin-top: 20px; font-size: 12px; font-weight: 600; color: #5E686D">フォルダ</label>
    <div style="margin-top: 8px; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 0 0 14px; border-radius: 22px; background: #F1F3F4">
      <input id="newpi-folder" type="text" value="~/work/web" style="flex: 1; min-width: 0; border: 0; outline: none; padding: 0; background: transparent; color: #1F2326; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px">
      <button aria-label="フォルダを参照" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; padding: 0; background: transparent; color: #5E686D; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linejoin: round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"></path></svg>
      </button>
    </div>
    <div style="margin-top: 14px; font-size: 12px; color: #5E686D">最近使ったフォルダ</div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
        <button style="height: 44px; display: flex; align-items: center; gap: 10px; border: 0; padding: 0; background: transparent; color: #1F2326; font-family: inherit; text-align: left">
          <span style="flex: 1; min-width: 0; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.path}}</span>
          <span style="font-size: 12px; color: #5E686D">{{r.note}}</span>
        </button>
      </sc-for>
    </div>

    <div style="margin-top: 20px; display: flex; align-items: center; gap: 16px">
      <div style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 15px">このフォルダを信頼する</span>
        <span style="font-size: 12px; line-height: 17px; color: #5E686D">フォルダ内の設定と Extension を読み込みます。起動時の Pi の確認は省かれます。</span>
      </div>
      <button role="switch" aria-checked="true" aria-label="このフォルダを信頼する" style="width: 51px; height: 31px; flex-shrink: 0; border: 0; padding: 2px; box-sizing: border-box; border-radius: 16px; background: #1B6B91; display: flex; justify-content: flex-end">
        <span style="width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF"></span>
      </button>
    </div>

    <button aria-haspopup="dialog" style="margin-top: 16px; height: 52px; display: flex; align-items: center; gap: 6px; border: 0; padding: 0; background: transparent; color: #1F2326; font-family: inherit; font-size: 15px; text-align: left">
      <span style="flex: 1">モデル</span>
      <span style="font-size: 14px; color: #5E686D">Opus 5.5 · high</span>
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #5E686D; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
    </button>

    <label for="newpi-prompt" style="margin-top: 20px; font-size: 12px; font-weight: 600; color: #5E686D">最初のメッセージ（任意）</label>
    <textarea id="newpi-prompt" rows="2" placeholder="起動したらすぐに送るメッセージ" style="margin-top: 8px; height: 72px; box-sizing: border-box; border: 0; outline: none; resize: none; padding: 12px 14px; border-radius: 18px; background: #F1F3F4; color: #1F2326; font-family: inherit; font-size: 15px; line-height: 22px"></textarea>
  </main>

  <footer style="flex-shrink: 0; padding: 12px 20px 30px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 12px; color: #5E686D; text-align: center">起動後は PC の <code style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace">pimate attach</code> で同じ Pi に接続できます</span>
    <button style="height: 48px; border: 0; border-radius: 24px; background: #1B6B91; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600">起動</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mc = (name, sel) => ({ name: name, isSel: sel, checked: sel ? 'true' : 'false' });
    return {
      machines: [mc('MacBook', true), mc('server-Macmini', false)],
      recent: [
        { path: '~/code/demo', note: 'Pi 1 件実行中' },
        { path: '~/work/api', note: '2日前' }
      ]
    };
  }
}
</script>
</body>
</html>
