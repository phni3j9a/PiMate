<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PC の Pi とつなぐ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;overflow:hidden}
a{color:#155A7A}a:hover{color:#1B6B91}
@keyframes pi-cursor{0%,55%{opacity:1}56%,100%{opacity:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF; color: #1F2326; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; font-size: 14px; line-height: 1.5; word-break: auto-phrase; text-wrap: pretty">
  <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; height: 47px; box-sizing: border-box; padding: 4px 28px 0 42px; display: flex; align-items: center; justify-content: space-between; color: #1F2326; pointer-events: none">
    <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.2px; font-variant-numeric: tabular-nums">9:41</span>
    <span style="display: flex; align-items: center; gap: 6px">
      <svg width="18" height="12" viewBox="0 0 18 12" style="fill: currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" style="fill: currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zM8 9.4c.5 0 .9.2 1.2.5L8 11.6 6.8 9.9c.3-.3.7-.5 1.2-.5z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" style="fill: none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" style="stroke: currentColor; opacity: 0.4"></rect><rect x="2" y="2" width="20" height="9" rx="2" style="fill: currentColor"></rect><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" style="fill: currentColor; opacity: 0.4"></path></svg>
    </span>
  </div>
  <div style="height: 47px; flex-shrink: 0"></div>
  <div style="height: 36px; flex-shrink: 0"></div>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column">
    <img src="../icon-kit/logo/mark-light-1024.png" alt="" width="44" height="44" style="width: 44px; height: 44px; display: block">
    <h1 style="margin: 18px 0 0; font-size: 22px; line-height: 30px; font-weight: 600">PC の Pi とつなぐ</h1>
    <p style="margin: 8px 0 0; font-size: 15px; line-height: 22.5px; color: #5E686D">PC で動いている Pi を、このスマホから確認・操作できます。</p>

    <figure aria-label="PC の Pi の画面" style="margin: 24px 0 0; padding: 14px 16px 12px; border-radius: 20px; background: {{termBg}}; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 4 4" aria-hidden="true" style="flex-shrink: 0; shape-rendering: crispEdges"><rect x="0" y="0" width="3" height="1" style="fill: {{logoCoral}}"></rect><rect x="2" y="1" width="1" height="1" style="fill: {{logoCoral}}"></rect><rect x="0" y="1" width="1" height="3" style="fill: {{logoBlue}}"></rect><rect x="1" y="2" width="1" height="1" style="fill: {{logoBlue}}"></rect><rect x="3" y="2" width="1" height="2" style="fill: {{logoYellow}}"></rect></svg>
        <span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: {{termDim}}">pi</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="height: 1px; background: {{termRule}}"></div>
        <div style="display: flex; align-items: center; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 14px; line-height: 20px; color: {{termText}}">/pimate setup<span aria-hidden="true" style="width: 8px; height: 17px; margin-left: 2px; background: {{termText}}; animation: pi-cursor 1.1s steps(1) infinite"></span></div>
        <div style="height: 1px; background: {{termRule}}"></div>
      </div>
      <figcaption style="font-size: 12px; line-height: 18px; color: {{termDim}}">PC の Pi でこう打つと、QR コードが表示されます</figcaption>
    </figure>

    <ol style="list-style: none; margin: 20px 0 0; padding: 0; display: flex; flex-direction: column">
      <li>
        <button style="width: 100%; min-height: 64px; display: flex; align-items: center; gap: 14px; border: 0; padding: 0; background: transparent; color: #1F2326; font-family: inherit; text-align: left">
          <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; background: #F1F3F4; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; color: #3A4246">1</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 15px; line-height: 22px">スマホと PC を Tailscale でつなぐ</span>
            <span style="font-size: 12px; line-height: 18px; color: #5E686D">両方で同じアカウントにログイン</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: #5E686D; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </li>
      <li>
        <button style="width: 100%; min-height: 64px; display: flex; align-items: center; gap: 14px; border: 0; padding: 0; background: transparent; color: #1F2326; font-family: inherit; text-align: left">
          <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; background: #F1F3F4; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; color: #3A4246">2</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 15px; line-height: 22px">PC に PiMate を入れる</span>
            <span style="font-size: 12px; line-height: 18px; color: #5E686D">Pi で <code style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #3A4246">/pimate setup</code> を実行</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: #5E686D; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </li>
      <li style="min-height: 64px; display: flex; align-items: center; gap: 14px">
        <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; background: #F1F3F4; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; color: #3A4246">3</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 15px; line-height: 22px">QR コードを読み取る</span>
          <span style="font-size: 12px; line-height: 18px; color: #5E686D">コードは 10 分間、1 回だけ使えます</span>
        </span>
      </li>
    </ol>
  </main>

  <footer style="flex-shrink: 0; padding: 8px 20px 30px; display: flex; flex-direction: column; gap: 4px">
    <button style="height: 48px; border: 0; border-radius: 12px; background: #1B6B91; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600">QRコードを読み取る</button>
    <button style="height: 44px; border: 0; padding: 0; background: transparent; color: #155A7A; font-family: inherit; font-size: 15px; font-weight: 600">リンクを貼り付ける</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"terminal":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.terminal ?? 'light') === 'dark';
    return dark
      ? { termBg: '#131618', termText: '#E4E8EA', termDim: '#9AA5AA', termRule: 'rgba(124, 190, 222, 0.55)', logoBlue: '#329DFD', logoCoral: '#FC7466', logoYellow: '#FDCA3D' }
      : { termBg: '#F1F3F4', termText: '#1F2326', termDim: '#5E686D', termRule: 'rgba(27, 107, 145, 0.45)', logoBlue: '#4C93BC', logoCoral: '#F38C7B', logoYellow: '#F5C15E' };
  }
}
</script>
</body>
</html>
