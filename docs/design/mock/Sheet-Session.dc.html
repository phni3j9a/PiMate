<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>セッション・Instance シート</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;overflow:hidden}
.sheet>*{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #1F2326; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; font-size: 14px; line-height: 1.5; word-break: auto-phrase; text-wrap: pretty">
  <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; z-index: 5; height: 47px; box-sizing: border-box; padding: 4px 28px 0 42px; display: flex; align-items: center; justify-content: space-between; color: #1F2326; pointer-events: none">
    <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.2px; font-variant-numeric: tabular-nums">9:41</span>
    <span style="display: flex; align-items: center; gap: 6px">
      <svg width="18" height="12" viewBox="0 0 18 12" style="fill: currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" style="fill: currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zM8 9.4c.5 0 .9.2 1.2.5L8 11.6 6.8 9.9c.3-.3.7-.5 1.2-.5z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" style="fill: none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" style="stroke: currentColor; opacity: 0.4"></rect><rect x="2" y="2" width="20" height="9" rx="2" style="fill: currentColor"></rect><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" style="fill: currentColor; opacity: 0.4"></path></svg>
    </span>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0">
    <div style="position: absolute; top: 47px; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px">
      <svg width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: #1F2326; stroke-width: 1.9; stroke-linecap: round"><path d="M4 8h16M4 16h10"></path></svg>
      <span style="font-size: 15px; font-weight: 600">--shout フラグを追加</span>
    </div>
    <div style="position: absolute; top: 120px; right: 20px; max-width: 280px; background: #DFE7EC; border-radius: 18px; padding: 10px 14px">プロジェクトの構成を説明して</div>
    <p style="position: absolute; top: 190px; left: 20px; right: 20px; margin: 0">CLI のエントリは <code style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; background: #F1F3F4; border-radius: 5px; padding: 1px 5px">src/cli.ts</code>、挨拶の生成は <code style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12.5px; background: #F1F3F4; border-radius: 5px; padding: 1px 5px">src/greet.ts</code> にまとまっています。</p>
    <div style="position: absolute; top: 260px; right: 20px; max-width: 280px; background: #DFE7EC; border-radius: 18px; padding: 10px 14px"><span style="color: #155A7A; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px">@src/greet.ts</span> に --shout フラグを追加して。テストも書いて</div>
    <div style="position: absolute; inset: 0; background: rgba(16, 24, 28, 0.32)"></div>
  </div>

  <section class="sheet" aria-label="セッションと Instance" style="position: absolute; left: 0; right: 0; bottom: 0; height: 500px; overflow: hidden; box-sizing: border-box; padding: 8px 20px 30px; border-radius: 16px 16px 0 0; background: #FFFFFF; display: flex; flex-direction: column">
    <div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #D3D9DC"></div>

    <div style="margin-top: 16px; display: flex; align-items: center; gap: 4px">
      <div style="flex: 1; min-width: 0">
        <h2 style="margin: 0; font-size: 17px; font-weight: 600; line-height: 24px">--shout フラグを追加</h2>
        <div style="font-size: 11px; color: #5E686D; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace">~/code/demo · MacBook</div>
      </div>
      <button aria-label="セッション名を変更" style="width: 44px; height: 44px; flex-shrink: 0; margin-right: -10px; border: 0; padding: 0; background: transparent; color: #5E686D; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"></path></svg>
      </button>
    </div>
    <div style="margin-top: 8px; font-size: 13px; color: #5E686D; font-variant-numeric: tabular-nums">メッセージ <b style="color: #1F2326; font-weight: 600">24</b> · トークン <b style="color: #1F2326; font-weight: 600">182K</b> · コスト <b style="color: #1F2326; font-weight: 600">$1.84</b></div>

    <div style="margin-top: 28px; font-size: 12px; font-weight: 600; color: #5E686D">会話</div>
    <div style="margin-top: 2px; display: flex; flex-direction: column">
      <sc-for list="{{actions}}" as="a" hint-placeholder-count="5">
        <button style="flex-shrink: 0; height: 52px; display: flex; align-items: center; gap: 12px; border: 0; padding: 0; background: transparent; color: #1F2326; font-family: inherit; font-size: 15px; text-align: left">
          <span style="flex: 1">{{a.label}}</span>
          <code style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: #5E686D">{{a.cmd}}</code>
        </button>
      </sc-for>
    </div>

    <div style="margin-top: 28px; font-size: 12px; font-weight: 600; color: #5E686D">この Pi</div>
    <div style="margin-top: 2px; flex-shrink: 0; height: 52px; display: flex; align-items: center; font-size: 15px">
      <span style="flex: 1">起動元</span>
      <span style="font-size: 13px; color: #5E686D">スマホ · PC から未接続</span>
    </div>
    <div style="display: flex; align-items: center; gap: 4px; height: 44px; padding-left: 14px; border-radius: 22px; background: #F1F3F4">
      <code style="flex: 1; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px">pimate attach demo-7f3a</code>
      <button aria-label="コマンドをコピー" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; padding: 0; background: transparent; color: #5E686D; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg>
      </button>
    </div>
    <div style="margin-top: 6px; font-size: 12px; color: #5E686D">PC のターミナルで実行すると、同じ Pi の画面に接続できます。</div>
    <button style="margin-top: 14px; height: 46px; border: 0; padding: 0; background: transparent; color: #A84D45; font-family: inherit; font-size: 15px; text-align: left">この Pi を終了…</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      actions: [
        { label: '新しいセッション', cmd: '/new' },
        { label: '過去のセッションを開く', cmd: '/resume' },
        { label: 'セッションツリー', cmd: '/tree' },
        { label: 'ここから分岐', cmd: '/fork' },
        { label: 'コンテキストを圧縮', cmd: '/compact' }
      ]
    };
  }
}
</script>
</body>
</html>
